name: Build and Push to ECR

on:
  push:
    branches:
      - main

env:
  FIXED_TAG: express

jobs:
  build-and-push:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          FIXED_TAG: ${{ env.FIXED_TAG }}
          GIT_SHA: ${{ github.sha }}

        run: |
          echo "REGISTRY=$REGISTRY"
          echo "REPOSITORY=$REPOSITORY"
          echo "FIXED_TAG=$FIXED_TAG"
          
          docker build -t $REGISTRY/$REPOSITORY:$FIXED_TAG .
          
          docker push $REGISTRY/$REPOSITORY:$FIXED_TAG

      - name: Restart systemd service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl restart express

      # - name: Start Instance Refresh for Express ASG
      #   run: |
      #       aws autoscaling start-instance-refresh \
      #         --auto-scaling-group-name "express-asg" \
      #         --preferences '{"MinHealthyPercentage":0,"SkipMatching":false}'
